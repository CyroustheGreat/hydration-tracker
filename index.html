<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hydration Tracker</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --blue: #0ea5e9; --blue-dark: #0284c7; --bg: #f0f9ff; --card: #ffffff; --text: #0f172a; --muted: #64748b; --border: #e2e8f0; --green: #16a34a; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 20px 16px 48px; }
  header { text-align: center; margin-bottom: 16px; }
  header h1 { font-size: 28px; }
  header p { color: var(--muted); }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .ring-wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .ring { position: relative; width: 200px; height: 200px; }
  .ring svg { transform: rotate(-90deg); width: 200px; height: 200px; }
  .ring-bg { fill: none; stroke: #e0f2fe; stroke-width: 16; }
  .ring-fg { fill: none; stroke: var(--blue); stroke-width: 16; stroke-linecap: round; transition: stroke-dashoffset .4s ease; }
  .ring-text { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .ring-text strong { font-size: 32px; }
  .ring-text span { color: var(--muted); font-size: 14px; }
  .sub { color: var(--muted); text-align: center; }
  .sub b { color: var(--green); }
  h2 { font-size: 18px; margin-bottom: 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .chip { border: 1px solid var(--border); background: #f8fafc; padding: 8px 14px; border-radius: 999px; cursor: pointer; font-size: 14px; }
  .chip.active { background: var(--blue); color: #fff; border-color: var(--blue); }
  .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn { border: none; border-radius: 12px; padding: 14px; font-size: 16px; font-weight: 600; cursor: pointer; }
  .btn-primary { background: var(--blue); color: #fff; }
  .btn-primary:hover { background: var(--blue-dark); }
  .btn-light { background: #e0f2fe; color: #075985; }
  .custom-row { display: flex; gap: 10px; margin-top: 10px; }
  .custom-row input { flex: 1; padding: 12px; border: 1px solid var(--border); border-radius: 12px; font-size: 16px; min-width: 0; }
  .log-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #f1f5f9; }
  .log-item:last-child { border-bottom: none; }
  .log-item .amt { font-weight: 700; }
  .log-item .time { color: var(--muted); font-size: 13px; }
  .log-item button { border: none; background: none; cursor: pointer; color: var(--muted); font-size: 14px; padding: 6px; }
  .log-item button:hover { color: #dc2626; }
  .empty { color: var(--muted); text-align: center; padding: 12px 0; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; text-align: center; margin-bottom: 14px; }
  .stat b { display: block; font-size: 20px; }
  .stat span { color: var(--muted); font-size: 12px; }
  .bars { display: flex; align-items: flex-end; gap: 8px; height: 120px; padding-top: 10px; }
  .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; }
  .bar { width: 100%; max-width: 36px; background: #bae6fd; border-radius: 6px 6px 0 0; min-height: 4px; }
  .bar.goal-met { background: var(--blue); }
  .bar-col span { font-size: 11px; color: var(--muted); }
  .bar-col small { font-size: 11px; font-weight: 600; }
  .settings label { display: block; font-size: 14px; color: var(--muted); margin: 10px 0 4px; }
  .settings input, .settings select { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 16px; }
  .settings .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .danger { background: none; border: none; color: #dc2626; cursor: pointer; font-size: 14px; padding: 8px 0; }
  footer { text-align: center; color: var(--muted); font-size: 13px; }
  @media (max-width: 420px) { .stats { grid-template-columns: repeat(3, 1fr); } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>💧 Hydration Tracker</h1>
    <p id="todayLabel"></p>
  </header>

  <section class="card ring-wrap">
    <div class="ring">
      <svg viewBox="0 0 200 200">
        <circle class="ring-bg" cx="100" cy="100" r="84"></circle>
        <circle class="ring-fg" id="ringFg" cx="100" cy="100" r="84"></circle>
      </svg>
      <div class="ring-text"><strong id="totalLabel">0 ml</strong><span id="pctLabel">0% of goal</span></div>
    </div>
    <p class="sub" id="remainingLabel"></p>
  </section>

  <section class="card">
    <h2>Add a drink</h2>
    <div class="chips" id="drinkChips"></div>
    <div class="btn-grid">
      <button class="btn btn-primary" id="glassBtn">🥛 + Glass</button>
      <button class="btn btn-primary" id="bottleBtn">🍼 + Bottle</button>
      <button class="btn btn-light" data-amt="100">+ 100 ml</button>
      <button class="btn btn-light" data-amt="200">+ 200 ml</button>
      <button class="btn btn-light" data-amt="330">+ 330 ml</button>
      <button class="btn btn-light" data-amt="500">+ 500 ml</button>
    </div>
    <div class="custom-row">
      <input id="customAmt" type="number" min="1" max="5000" placeholder="Custom amount (ml)">
      <button class="btn btn-primary" id="customBtn">Add</button>
    </div>
  </section>

  <section class="card">
    <h2>Today's log</h2>
    <div id="logList"></div>
    <button class="danger" id="clearBtn">Clear today</button>
  </section>

  <section class="card">
    <h2>Last 7 days</h2>
    <div class="stats">
      <div class="stat"><b id="avgLabel">0</b><span>7-day average</span></div>
      <div class="stat"><b id="goalDaysLabel">0 / 7</b><span>days at goal</span></div>
      <div class="stat"><b id="bestLabel">0</b><span>best day</span></div>
    </div>
    <div class="bars" id="bars"></div>
  </section>

  <section class="card settings">
    <h2>Settings</h2>
    <label for="goalInput">Daily goal (ml)</label>
    <input id="goalInput" type="number" min="500" max="10000" step="50">
    <div class="row">
      <div><label for="glassInput">Glass size (ml)</label><input id="glassInput" type="number" min="50" max="1000"></div>
      <div><label for="bottleInput">Bottle size (ml)</label><input id="bottleInput" type="number" min="100" max="2000"></div>
    </div>
    <label for="unitSelect">Units</label>
    <select id="unitSelect"><option value="ml">Millilitres (ml)</option><option value="oz">Fluid ounces (oz)</option></select>
  </section>

  <footer>Your drinks are saved in this browser only. A new day starts fresh at midnight.</footer>
</div>

<script>
const DRINKS = ["Water","Sparkling","Tea","Coffee","Juice","Other"];
// Local calendar day. toISOString() is UTC, so the day rolled over early for
// anyone west of Greenwich (around 5pm in Vancouver during daylight time).
function localDateKey(date) {
  const d = date || new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return y + "-" + m + "-" + day;
}
const todayKey = () => localDateKey();
const fmtDate = d => new Date(d + "T12:00:00").toLocaleDateString(undefined, {weekday:"long", month:"long", day:"numeric"});
let settings = JSON.parse(localStorage.getItem("ht_settings") || "{}");
settings = { goal: settings.goal || 2000, glass: settings.glass || 250, bottle: settings.bottle || 500, unit: settings.unit || "ml" };
let selectedDrink = "Water";
function loadData(){ try { return JSON.parse(localStorage.getItem("ht_data") || "{}"); } catch(e){ return {}; } }
function saveData(d){ localStorage.setItem("ht_data", JSON.stringify(d)); }
function saveSettings(){ localStorage.setItem("ht_settings", JSON.stringify(settings)); }
function todayEntries(){ const d = loadData(); return d[todayKey()] || []; }
function displayAmt(ml){ if(settings.unit==="oz") return (ml/29.5735).toFixed(1)+" oz"; return ml+" ml"; }
function addDrink(ml, drink){
  if(!ml || ml <= 0) return;
  const d = loadData(); const k = todayKey();
  d[k] = d[k] || [];
  d[k].push({ id: Date.now()+Math.random(), ml: Math.round(ml), drink: drink||selectedDrink, time: new Date().toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"}) });
  saveData(d); render();
}
function deleteEntry(id){ const d = loadData(); d[todayKey()] = (d[todayKey()]||[]).filter(e=>e.id!==id); saveData(d); render(); }
function render(){
  document.getElementById("todayLabel").textContent = fmtDate(todayKey());
  const entries = todayEntries();
  const total = entries.reduce((s,e)=>s+e.ml,0);
  const pct = Math.min(100, Math.round(total/settings.goal*100));
  const C = 2*Math.PI*84;
  const ring = document.getElementById("ringFg");
  ring.style.strokeDasharray = C; ring.style.strokeDashoffset = C*(1-pct/100);
  document.getElementById("totalLabel").textContent = displayAmt(total);
  document.getElementById("pctLabel").textContent = pct+"% of "+displayAmt(settings.goal)+" goal";
  document.getElementById("remainingLabel").innerHTML = total>=settings.goal ? "<b>🎉 Goal reached — nice work!</b>" : "You still need <b>"+displayAmt(settings.goal-total)+"</b> to reach your goal.";
  document.getElementById("glassBtn").textContent = "🥛 + Glass ("+displayAmt(settings.glass)+")";
  document.getElementById("bottleBtn").textContent = "🍼 + Bottle ("+displayAmt(settings.bottle)+")";
  const chips = document.getElementById("drinkChips");
  chips.innerHTML = "";
  DRINKS.forEach(dr=>{ const b=document.createElement("button"); b.className="chip"+(dr===selectedDrink?" active":""); b.textContent=dr; b.onclick=()=>{selectedDrink=dr; render();}; chips.appendChild(b); });
  const list = document.getElementById("logList");
  if(!entries.length){ list.innerHTML = '<p class="empty">No drinks logged yet today. Tap + Glass to start.</p>'; }
  else {
    list.innerHTML = "";
    [...entries].reverse().forEach(e=>{
      const row=document.createElement("div"); row.className="log-item";
      row.innerHTML = '<div><div class="amt">'+e.drink+' — '+displayAmt(e.ml)+'</div><div class="time">'+e.time+'</div></div>';
      const del=document.createElement("button"); del.textContent="Delete"; del.onclick=()=>deleteEntry(e.id);
      row.appendChild(del); list.appendChild(row);
    });
  }
  // Last 7 days
  const data = loadData(); const days=[];
  for(let i=6;i>=0;i--){ const dt=new Date(); dt.setDate(dt.getDate()-i); const k=localDateKey(dt); const t=(data[k]||[]).reduce((s,e)=>s+e.ml,0); days.push({k, label: dt.toLocaleDateString([], {weekday:"short"}), total:t}); }
  const max = Math.max(settings.goal, ...days.map(d=>d.total));
  const bars = document.getElementById("bars"); bars.innerHTML="";
  days.forEach(d=>{ const col=document.createElement("div"); col.className="bar-col"; const h=Math.max(4, d.total/max*90); col.innerHTML='<small>'+(d.total?Math.round(d.total):"")+'</small><div class="bar'+(d.total>=settings.goal?" goal-met":"")+'" style="height:'+h+'px"></div><span>'+d.label+'</span>'; bars.appendChild(col); });
  const avg = Math.round(days.reduce((s,d)=>s+d.total,0)/7);
  document.getElementById("avgLabel").textContent = settings.unit==="oz" ? (avg/29.5735).toFixed(1)+" oz" : avg+" ml";
  document.getElementById("goalDaysLabel").textContent = days.filter(d=>d.total>=settings.goal).length+" / 7";
  const best = Math.max(...days.map(d=>d.total));
  document.getElementById("bestLabel").textContent = settings.unit==="oz" ? (best/29.5735).toFixed(1)+" oz" : best+" ml";
  document.getElementById("goalInput").value = settings.goal;
  document.getElementById("glassInput").value = settings.glass;
  document.getElementById("bottleInput").value = settings.bottle;
  document.getElementById("unitSelect").value = settings.unit;
}
document.getElementById("glassBtn").onclick = ()=>addDrink(settings.glass);
document.getElementById("bottleBtn").onclick = ()=>addDrink(settings.bottle);
document.querySelectorAll("[data-amt]").forEach(b=> b.onclick = ()=>addDrink(parseInt(b.dataset.amt,10)));
document.getElementById("customBtn").onclick = ()=>{ const v=parseInt(document.getElementById("customAmt").value,10); if(v>0){ addDrink(v); document.getElementById("customAmt").value=""; } };
document.getElementById("customAmt").addEventListener("keydown", e=>{ if(e.key==="Enter") document.getElementById("customBtn").click(); });
document.getElementById("clearBtn").onclick = ()=>{ if(confirm("Clear all of today's drinks?")){ const d=loadData(); d[todayKey()]=[]; saveData(d); render(); } };
document.getElementById("goalInput").onchange = e=>{ const v=parseInt(e.target.value,10); if(v>=500){ settings.goal=v; saveSettings(); render(); } };
document.getElementById("glassInput").onchange = e=>{ const v=parseInt(e.target.value,10); if(v>0){ settings.glass=v; saveSettings(); render(); } };
document.getElementById("bottleInput").onchange = e=>{ const v=parseInt(e.target.value,10); if(v>0){ settings.bottle=v; saveSettings(); render(); } };
document.getElementById("unitSelect").onchange = e=>{ settings.unit=e.target.value; saveSettings(); render(); };
render();
</script>
</body>
</html>
